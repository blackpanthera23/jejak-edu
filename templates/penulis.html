<article class="py-12">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <a href="/penulis.html" class="inline-flex items-center gap-1.5 min-h-11 text-sm
       text-slate-600 hover:text-teal-700 transition-colors mb-6 rounded-lg
       focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-teal-700">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Semua penulis
    </a>

    <header class="flex items-start gap-5 pb-8 border-b border-stone-500">
      <img src="<%= avatar %>" alt="" width="320" height="320" loading="lazy" decoding="async"
           class="w-20 h-20 sm:w-24 sm:h-24 rounded-full object-cover border-2 border-teal-200 shrink-0" />
      <div class="min-w-0">
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 leading-tight mb-1">
          <%= nama %>
        </h1>
        <p class="text-sm font-semibold text-teal-700 mb-3"><%= peranan %></p>
        <p class="text-slate-600 leading-relaxed"><%= bio %></p>
      </div>
    </header>

    <%- bioPanjang %>

    <section class="mt-8" aria-labelledby="hubungi-tajuk">
      <h2 id="hubungi-tajuk" class="text-xs font-bold text-slate-900 uppercase tracking-wide mb-3">
        Hubungi
      </h2>
      <ul class="flex flex-wrap gap-2">
        <li>
          <a href="mailto:<%= emel %>"
             class="inline-flex items-center gap-2 min-h-11 px-4 py-2.5 rounded-lg bg-white
                    border border-slate-500 text-slate-700 hover:bg-stone-100 hover:border-teal-600
                    font-semibold text-sm transition-colors focus-visible:outline-none
                    focus-visible:ring-2 focus-visible:ring-teal-700 focus-visible:ring-offset-2">
            Hantar emel
          </a>
        </li>
        <%- pautanLain %>
      </ul>
      <p class="mt-3 text-xs text-slate-600">
        Kami balas dalam 3 hari bekerja. Untuk pembetulan fakta, sila sertakan pautan sumber.
      </p>
    </section>

    <section class="mt-12" aria-labelledby="artikel-tajuk">
      <h2 id="artikel-tajuk" class="text-xl font-bold text-slate-900 mb-5">
        Artikel oleh <%= nama %> <span class="text-slate-600 font-normal">(<%= bilanganArtikel %>)</span>
      </h2>
      <%- artikelPenulis %>
    </section>
  </div>
</article>
